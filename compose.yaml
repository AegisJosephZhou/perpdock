services:
  funding:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the HTTPS origin}
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET:?Set a stable random ORDER_TOKEN_SECRET}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID:-}
      ATTRIBUTION_ENABLED: ${ATTRIBUTION_ENABLED:-false}
      ATTRIBUTION_CAMPAIGNS: ${ATTRIBUTION_CAMPAIGNS:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      FUNNEL_ENABLED: ${FUNNEL_ENABLED:-false}
      POSTHOG_ENABLED: ${POSTHOG_ENABLED:-false}
      POSTHOG_PROJECT_KEY: ${POSTHOG_PROJECT_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-https://ethereum.publicnode.com}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-https://arbitrum-one.publicnode.com}
      BASE_RPC_URL: ${BASE_RPC_URL:-https://base.drpc.org}
      OPTIMISM_RPC_URL: ${OPTIMISM_RPC_URL:-https://optimism.publicnode.com}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://polygon-bor-rpc.publicnode.com}
      BNB_RPC_URL: ${BNB_RPC_URL:-https://bsc-rpc.publicnode.com}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      PAUSE_NEW_ORDERS: ${PAUSE_NEW_ORDERS:-false}
      MIN_AMOUNT: ${MIN_AMOUNT:-10}
      MAX_AMOUNT: ${MAX_AMOUNT:-1000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
    volumes:
      - funding-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  funding-data:
